name = "gomma"
main = "worker.js"
compatibility_date = "2024-01-01"

[assets]
directory = "./dashboard-dist"
run_worker_first = ["/v1/*", "/api/*"]
not_found_handling = "single-page-application"

[[ratelimits]]
name = "INTAKE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "ESTIMATE_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 3
  period = 60

